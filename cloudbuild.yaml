steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/followlytics:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/followlytics:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/followlytics:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/followlytics:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'followlytics'
      - '--image=gcr.io/$PROJECT_ID/followlytics:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
images:
  - 'gcr.io/$PROJECT_ID/followlytics:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/followlytics:latest'
